sharedMappings:
  wikidataOrganisation: &wikidataOrganisation
  - property: http://www.w3.org/1999/02/22-rdf-syntax-ns#type
    action: if missing
    value: https://vocabs.acdh.oeaw.ac.at/schema#Organisation
    type: resource
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasTitle
    action: if missing
    type: literal
    langProcess: assure
    langValue: und
    preferredLangs:
      - en
      - de    
    path:
    - http://www.w3.org/2000/01/rdf-schema#label
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasTitle
    action: if missing
    type: literal
    langProcess: assure
    langValue: und
    preferredLangs:
      - en
      - de    
    path:
    - http://www.w3.org/2004/02/skos/core#prefLabel
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasTitle
    action: if missing
    type: literal
    langProcess: assure
    langValue: und
    preferredLangs:
      - en
      - de    
    path:
    - http://schema.org/name
referenceSources:
  wikidata:
