sharedMappings:
  placeMatch: &placeMatch geonames|getty.edu|d-nb.info|gazetteer.dainst.org|pleiades.stoa.org|wikidata.org
  personMatch: &personMatch wikidata.org|orcid.org|d-nb.info|viaf.org
  orgMatch: &orgMatch wikidata.org|d-nb.info|viaf.org|ror.org
  gndIdPlace: &gndIdPlace
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
    action: add
    type: id
    path:
    - http://www.w3.org/2002/07/owl#sameAs
    match: *placeMatch
  gndIdPerson: &gndIdPerson
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
    action: add
    type: id
    path:
    - http://www.w3.org/2002/07/owl#sameAs
    match: *personMatch
  gndIdOrg: &gndIdOrg
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
    action: add
    type: id
    path:
    - http://www.w3.org/2002/07/owl#sameAs
    match: *orgMatch
  wikidataIdPlace: &wikidataIdPlace
  # geonames
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
    action: add
    type: id
    path:
    - http://www.wikidata.org/prop/direct-normalized/P1566
  # GETTY
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
    action: add
    type: id
    path:
    - http://www.wikidata.org/prop/direct-normalized/P1667
  # GND
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
    action: add
    type: id
    path:
    - http://www.wikidata.org/prop/direct-normalized/P227
  # PLEIADES
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
    action: add
    type: id
    path:
    - http://www.wikidata.org/prop/direct-normalized/P1584
  wikidataIdPerson: &wikidataIdPerson
  # ORCID
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
    action: add
    type: id
    path:
    - http://www.wikidata.org/prop/direct-normalized/P496
  # GND
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
    action: add
    type: id
    path:
    - http://www.wikidata.org/prop/direct-normalized/P227
  # VIAF
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
    action: add
    type: id
    path:
    - http://www.wikidata.org/prop/direct-normalized/P214
  wikidataIdOrg: &wikidataIdOrg
  # GND
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
    action: add
    type: id
    path:
    - http://www.wikidata.org/prop/direct-normalized/P227
  # VIAF
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
    action: add
    type: id
    path:
    - http://www.wikidata.org/prop/direct-normalized/P214
  # ROR
  - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
    action: add
    type: id
    path:
    - http://www.wikidata.org/prop/direct-normalized/P6782
referenceSources:
  # geonames, getty, pleiades, orcid, ror provides no external identifiers 
  # or we don't trust the data they provide
  gnd:
    # Place
    https://d-nb.info/standards/elementset/gnd#AdministrativeUnit:        *gndIdPlace
    https://d-nb.info/standards/elementset/gnd#BuildingOrMemorial:        *gndIdPlace
    https://d-nb.info/standards/elementset/gnd#Country:                   *gndIdPlace
    https://d-nb.info/standards/elementset/gnd#ExtraterrestrialTerritory: *gndIdPlace
    https://d-nb.info/standards/elementset/gnd#FictivePlace:              *gndIdPlace
    https://d-nb.info/standards/elementset/gnd#MemberState:               *gndIdPlace
    https://d-nb.info/standards/elementset/gnd#NameOfSmallGeographicUnitLyingWithinAnotherGeographicUnit: *gndIdPlace
    https://d-nb.info/standards/elementset/gnd#NaturalGeographicUnit:     *gndIdPlace
    https://d-nb.info/standards/elementset/gnd#ReligiousTerritory:        *gndIdPlace
    https://d-nb.info/standards/elementset/gnd#TerritorialCorporateBodyOrAdministrativeUnit: *gndIdPlace
    https://d-nb.info/standards/elementset/gnd#WayBorderOrLine:           *gndIdPlace
    # Person
    https://d-nb.info/standards/elementset/gnd#DifferentiatedPerson: *gndIdPerson
    # Organisation
    https://d-nb.info/standards/elementset/gnd#CorporateBody: *gndIdOrg
  gazetteer:
    http://www.cidoc-crm.org/rdfs/cidoc-crm#E53_Place:
    - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
      action: add
      type: id
      path:
      - http://www.w3.org/2002/07/owl#sameAs
      match: *placeMatch
  # wikidata is evil
  wikidata:
    # Place
    http://www.wikidata.org/entity/Q200250:    *wikidataIdPlace
    http://www.wikidata.org/entity/Q515:       *wikidataIdPlace
    http://www.wikidata.org/entity/Q7930989:   *wikidataIdPlace
    http://www.wikidata.org/entity/Q124250988: *wikidataIdPlace
    http://www.wikidata.org/entity/Q486972:    *wikidataIdPlace
    http://www.wikidata.org/entity/Q123964505: *wikidataIdPlace
    http://www.wikidata.org/entity/Q839954:    *wikidataIdPlace
    http://www.wikidata.org/entity/Q2221906:   *wikidataIdPlace
    http://www.wikidata.org/entity/Q17334923:  *wikidataIdPlace
    http://www.wikidata.org/entity/Q27096213:  *wikidataIdPlace
    # Person
    http://www.wikidata.org/entity/Q5: *wikidataIdPerson
    # Organisation
    http://www.wikidata.org/entity/Q1371037:  *wikidataIdOrg
    http://www.wikidata.org/entity/Q162633:   *wikidataIdOrg
    http://www.wikidata.org/entity/Q16519632: *wikidataIdOrg
    http://www.wikidata.org/entity/Q1664720:  *wikidataIdOrg
    http://www.wikidata.org/entity/Q31855:    *wikidataIdOrg
    http://www.wikidata.org/entity/Q3918:     *wikidataIdOrg
    http://www.wikidata.org/entity/Q414147:   *wikidataIdOrg
    http://www.wikidata.org/entity/Q43229:    *wikidataIdOrg
    http://www.wikidata.org/entity/Q4671277:  *wikidataIdOrg
    http://www.wikidata.org/entity/Q4830453:  *wikidataIdOrg
    http://www.wikidata.org/entity/Q5341295:  *wikidataIdOrg
  viaf:
    http://schema.org/Person:
    - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
      action: add
      type: id
      path:
      - http://schema.org/sameAs
      # orcid in viaf seems strange - skipping
      match: wikidata.org|d-nb.info|viaf.or
    http://schema.org/Organization:
    - property: https://vocabs.acdh.oeaw.ac.at/schema#hasIdentifier
      action: add
      type: id
      path:
      - http://schema.org/sameAs
      match: *orgMatch
