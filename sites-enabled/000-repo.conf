<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /home/www-data/docroot
    
    Include /etc/apache2/conf-available/bots.conf

    RewriteEngine On
    RewriteRule ^/$ /guiApi/ [R]
    RewriteRule ^/oai/?$ /oaipmh/ [R=301]
    RewriteCond %{SERVER_NAME} !localhost|127.0.0.1
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !^/named_entities.html$
    RewriteCond %{REQUEST_FILENAME} !^/robots.txt$
    RewriteCond %{REQUEST_FILENAME} !^/google[a-z0-9]+[.]html$
    RewriteRule ^(/[^/]*)$ https://%{HTTP_HOST}$1/ [R=301,L]

    LimitRequestBody 0
    php_value memory_limit 1024M
    php_value max_execution_time 180

    <Directory /home/www-data/docroot>
        Options All
        AllowOverride All
        Require all granted
    </Directory>
    # Route Symfony URLs through its front controller under /guiApi.
    <Directory /home/www-data/docroot/guiApi>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /guiApi/index.php

        SetEnv APP_ENV prod
        SetEnv APP_DEBUG 0
    </Directory>
</VirtualHost>

